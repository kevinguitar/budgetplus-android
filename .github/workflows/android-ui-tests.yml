name: Android UI Tests

on:
  workflow_call:

jobs:
  android-ui-tests:
    name: Android UI tests
    runs-on: ubuntu-latest
    # Cap the whole job so a crashed/offline emulator (which leaves adb spinning on
    # `- waiting for device -`) can't hang the run indefinitely.
    timeout-minutes: 90
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000

    steps:
      - uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-strict-match: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/android
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The suite runs 30+ sequential `maestro test` invocations, each of which
          # installs/uninstalls its instrumentation driver. On a resource-starved
          # emulator that slow leak eventually pushes the device `offline`, which
          # surfaces as `device 'emulator-5554' not found`. Give the emulator a
          # generous RAM/heap/core budget so it survives the whole run.
          ram-size: 4096M
          heap-size: 1024M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096 -cores 3
          # android-emulator-runner runs each line of an inline script as its own
          # `/usr/bin/sh -c` (dash), which cannot express `set -o pipefail` or a
          # heredoc. Invoke a committed script once with bash so everything shares
          # one shell.
          script: bash ui-tests/scripts/run-android-ci.sh

      - name: Upload Android UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-artifacts
          path: |
            build/maestro/android
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
