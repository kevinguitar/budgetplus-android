name: iOS UI Tests

on:
  workflow_call:

jobs:
  ios-ui-tests:
    name: iOS UI tests
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-strict-match: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native compiler and platform libs
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Configure fake Firebase app
        run: cp ui-tests/config/GoogleService-Info.plist iosApp/iosApp/GoogleService-Info.plist

      - name: Run iOS UI tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | test("iPhone")))][0].udid')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ./build/ui-tests \
            CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) UI_TEST'
          xcrun simctl uninstall "$SIMULATOR_ID" com.kevlina.budgetplus || true
          xcrun simctl install "$SIMULATOR_ID" build/ui-tests/Build/Products/Debug-iphonesimulator/BudgetPlus.app
          mkdir -p build/maestro/ios
          set +e
          firebase --config ui-tests/config/firebase.json --project budgetplus-ui-tests emulators:exec --only auth,firestore "$HOME/.maestro/bin/maestro test --test-output-dir=build/maestro/ios --debug-output=build/maestro/ios --format=html --output=build/maestro/ios/report.html ui-tests"
          result=$?
          xcrun simctl io "$SIMULATOR_ID" screenshot build/maestro/ios/final-screen.png || true
          exit $result

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-artifacts
          path: |
            build/maestro/ios
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
