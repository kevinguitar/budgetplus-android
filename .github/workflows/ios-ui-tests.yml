name: iOS UI Tests

on:
  workflow_call:

jobs:
  ios-ui-tests:
    name: iOS UI tests
    runs-on: macos-latest
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # CI only runs on pull_request (there is no push-to-main trigger), so the
          # Gradle cache must be written from PR runs; otherwise every run recompiles the
          # Kotlin/Native framework cold (~15 min). Cache entries are keyed by content, so
          # PRs sharing the same Gradle inputs converge on the same immutable entry.
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native compiler and platform libs
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ./build
          key: ${{ runner.os }}-ddata-${{ hashFiles('**/Package.resolved', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-ddata-

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run iOS UI tests
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/ios
        run: |
          # Boot the first available iPhone simulator and pass its name to the runner script.
          SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | test("iPhone")))][0]')
          SIMULATOR_ID=$(echo "$SIMULATOR" | jq -r '.udid')
          SIMULATOR_NAME=$(echo "$SIMULATOR" | jq -r '.name')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          mkdir -p build/maestro/ios
          set +e
          # The runner script swaps in the test Firebase config, builds the app, forces the
          # simulator to English, and runs the login/free/premium suites inside the Firebase
          # emulators. It restores the production GoogleService-Info.plist on exit.
          ./ui-tests/scripts/run-ios-ui-tests.sh "$SIMULATOR_NAME"
          result=$?
          xcrun simctl io "$SIMULATOR_ID" screenshot build/maestro/ios/final-screen.png || true
          exit $result

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-artifacts
          path: |
            build/maestro/ios
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
