# R5 — Add income end-to-end
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "AC"
- tapOn:
    text: "Income"
# The income note placeholder lives just below the category grid, above the fixed
# calculator. Its scroll region is small, so scrollUntilVisible (which targets the
# largest scrollable) doesn't reliably move it. Swipe up within the info band instead,
# then assert (proves the record type switched to Income).
- swipe:
    start: "50%,40%"
    end: "50%,20%"
    duration: 400
- assertVisible:
    text: "Where did you earn from?"
- tapOn:
    text: "Salary"
- tapOn:
    text: "5"
- tapOn:
    text: "0"
- assertVisible:
    text: "50"
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible:
      text: "0"
    timeout: 10000
# restore to Expense for subsequent flows
- tapOn:
    text: "Expense"
