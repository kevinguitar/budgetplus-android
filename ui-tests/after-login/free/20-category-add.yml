# C1/C2 — Enter Edit Categories, add a category, save
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-category-editor.yml
# Add a new category via the FAB.
- tapOn:
    text: "Add"
- assertVisible:
    text: "Category"
- inputText: "Groceries"
# Submit via the keyboard's done action (works cross-platform; the dialog's onDone
# confirms the entry). Avoids hideKeyboard which is unreliable on iOS.
- pressKey: Enter
# The new category is appended to the end of the list, which sits below the fold on
# short screens; scroll it into view before asserting.
- scrollUntilVisible:
    element:
      text: "Groceries"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Groceries"
# Save the list.
- tapOn:
    text: "Save"
- assertVisible:
    text: "Category list has been saved"
- runFlow: ../../common/assert-on-record.yml
