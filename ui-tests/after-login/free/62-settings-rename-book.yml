# ST4 — Rename book
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Rename Book"
- extendedWaitUntil:
    visible:
      text: "Book Name"
    timeout: 15000
- tapOn:
    text: "Book Name"
- eraseText
- inputText: "Renamed Book"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Renamed the book to Renamed Book"
    timeout: 10000
# Rename back so later flows still find "UI Test Book".
- tapOn:
    text: "Rename Book"
- extendedWaitUntil:
    visible:
      text: "Book Name"
    timeout: 15000
- tapOn:
    text: "Book Name"
- eraseText
- inputText: "UI Test Book"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Renamed the book to UI Test Book"
    timeout: 10000
- runFlow: ../../common/return-to-record.yml
