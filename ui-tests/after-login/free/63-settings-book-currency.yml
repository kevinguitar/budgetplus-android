# ST5 — Edit book currency (change to Euro, then restore US Dollar)
# Note: committing a currency change triggers app navigation that can land on either
# Settings or Record, so we assert the picker closed (change accepted) and recover.
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "Euro"
# The picker closes once the change is committed. The first tap on a currency tile
# occasionally does not register on iOS (the picker stays open), so retry once if it is
# still showing. The retry tap is optional: the picker may be mid-close when the retry
# fires, in which case the tile is already gone and no tap is needed.
- runFlow:
    when:
      visible:
        text: "Book's Currency"
    commands:
      - tapOn:
          text: "Euro"
          optional: true
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- assertNotVisible:
    text: "Book's Currency"
- runFlow: ../../common/return-to-record.yml
# Restore US Dollar so later flows keep the default currency.
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "US Dollar"
- runFlow:
    when:
      visible:
        text: "Book's Currency"
    commands:
      - tapOn:
          text: "US Dollar"
          optional: true
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
