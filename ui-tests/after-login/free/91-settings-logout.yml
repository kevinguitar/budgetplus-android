# ST14 — Logout (destructive; runs last in the free suite)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Logout"
    direction: DOWN
    visibilityPercentage: 80
    centerElement: true
- tapOn:
    text: "Logout"
- extendedWaitUntil:
    visible:
      text: "Continue with Google"
    timeout: 20000
- assertVisible:
    text: "Continue with Google"
