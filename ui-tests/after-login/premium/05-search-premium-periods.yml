# P5 — Premium user can select premium search periods without a paywall
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    point: "74%,96%"
- extendedWaitUntil:
    visible:
      text: ".*'s Overview"
    timeout: 15000
# The persistent "Premium unlocked!" snackbar overlaps the bottom-right Search FAB
# on iOS. Swipe it away by coordinate (swipe-on-text doesn't dismiss it on iOS) so
# the FAB is fully exposed, then tap Search.
- runFlow:
    when:
      visible:
        text: "Budget+ Premium unlocked!"
    commands:
      - swipe:
          start: "15%,92%"
          end: "95%,92%"
          duration: 400
      - extendedWaitUntil:
          notVisible:
            text: "Budget+ Premium unlocked!"
          timeout: 8000
- tapOn:
    text: "Search"
- extendedWaitUntil:
    visible:
      text: "Enter keyword"
    timeout: 15000
- tapOn:
    text: "Last Month"
- assertVisible:
    text: "Last 6 Months"
# Premium: selecting a premium period stays in Search (no paywall).
- tapOn:
    text: "Last 6 Months"
- extendedWaitUntil:
    visible:
      text: "Enter keyword"
    timeout: 15000
- assertVisible:
    text: "Enter keyword"
- runFlow: ../../common/return-to-record.yml
