# P6 — Premium user can set a preferred currency (free users are paywalled)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Preferred Currency"
# Premium: the Preferred Currency picker opens (not the paywall).
- extendedWaitUntil:
    visible:
      text: "Preferred Currency"
    timeout: 15000
- assertVisible:
    text: "Preferred Currency"
- tapOn:
    text: "Euro"
# The picker closes once the change is committed.
- extendedWaitUntil:
    notVisible:
      text: "Preferred Currency"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
# Restore the preferred currency to US Dollar.
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Preferred Currency"
- extendedWaitUntil:
    visible:
      text: "Preferred Currency"
    timeout: 15000
- tapOn:
    text: "US Dollar"
- extendedWaitUntil:
    notVisible:
      text: "Preferred Currency"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
