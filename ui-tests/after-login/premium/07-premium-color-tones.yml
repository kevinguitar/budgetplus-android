# P7 — Premium user can select and save a premium color tone (no paywall)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Color Tone Picker"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Color Tone Picker"
- extendedWaitUntil:
    visible:
      text: "Color Tone Picker"
    timeout: 15000
# Swipe to a premium tone (Barbie and Ken is the 4th tone). Swipe one page at a
# time with a settle wait between flings so pages don't get skipped/overshot.
#
# Coordinates matter here. The tone pager sits near the BOTTOM of the screen
# (measured bounds put its vertical center at ~78% of screen height, not the
# middle), so a mid-screen swipe lands on the Color Preview card above it and
# never touches the pager. A Compose HorizontalPager also only changes page when
# the drag clears ~50% of a page width or flings fast enough, so we drag nearly
# full width (90% -> 10%) at a brisk 200ms to guarantee the page advances.
- swipe:
    start: "90%, 78%"
    end: "10%, 78%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Warm Tones of Dusk"
    timeout: 10000
- swipe:
    start: "90%, 78%"
    end: "10%, 78%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Countryside"
    timeout: 10000
- swipe:
    start: "90%, 78%"
    end: "10%, 78%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Barbie and Ken"
    timeout: 10000
# Premium: saving a premium tone succeeds (no paywall).
- tapOn:
    text: "Save"
- runFlow: ../../common/return-to-record.yml
