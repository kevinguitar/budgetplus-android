# P7 — Premium user can select and save a premium color tone (no paywall)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Color Tone Picker"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Color Tone Picker"
- extendedWaitUntil:
    visible:
      text: "Color Tone Picker"
    timeout: 15000
# Swipe to a premium tone (Barbie and Ken is the 4th tone). Swipe one page at a
# time with a settle wait between flings so pages don't get skipped/overshot.
# Use explicit start/end coordinates across the pager: swiping "from" the pager's
# merged accessibility node only covers a small region on iOS and doesn't produce
# a real fling, leaving the pager on the first page. A wide horizontal drag at the
# pager's vertical center reliably advances exactly one page on both platforms.
- swipe:
    start: "85%, 55%"
    end: "15%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Warm Tones of Dusk"
    timeout: 10000
- swipe:
    start: "85%, 55%"
    end: "15%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Countryside"
    timeout: 10000
- swipe:
    start: "85%, 55%"
    end: "15%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Barbie and Ken"
    timeout: 10000
# Premium: saving a premium tone succeeds (no paywall).
- tapOn:
    text: "Save"
- runFlow: ../../common/return-to-record.yml
