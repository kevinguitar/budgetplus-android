# P7 — Premium user can select and save a premium color tone (no paywall)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Color Tone Picker"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Color Tone Picker"
- extendedWaitUntil:
    visible:
      text: "Color Tone Picker"
    timeout: 15000
# On short screens the tone carousel sits below the preview fold. Scroll the picker
# content up so the carousel band is fully on screen, then swipe it horizontally. We
# scroll by a vertical swipe (the pager's contentDescription is not reliably exposed in
# the view hierarchy, so element-anchored scrolling/swiping is flaky).
- swipe:
    start: "50%,80%"
    end: "50%,35%"
    duration: 400
# Swipe to a premium tone (Barbie and Ken is the 4th tone). Swipe by fixed coordinates
# inside the carousel band; settle between flings so pages aren't skipped/overshot.
- swipe:
    start: "85%,70%"
    end: "15%,70%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Warm Tones of Dusk"
    timeout: 10000
- swipe:
    start: "85%,70%"
    end: "15%,70%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Countryside"
    timeout: 10000
- swipe:
    start: "85%,70%"
    end: "15%,70%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Barbie and Ken"
    timeout: 10000
# Premium: saving a premium tone succeeds (no paywall).
- tapOn:
    text: "Save"
- runFlow: ../../common/return-to-record.yml
