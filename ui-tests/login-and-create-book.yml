appId: com.kevlina.budgetplus
---
- launchApp
- extendedWaitUntil:
    visible: Continue with Google
    timeout: 30000
- tapOn: Continue with Google
- extendedWaitUntil:
    visible: Book Name
    timeout: 60000
- tapOn: My accounting book
- inputText: UI Test Book
- tapOn: Go
- extendedWaitUntil:
    visible:
      text: AC
    timeout: 30000
- assertVisible: AC
