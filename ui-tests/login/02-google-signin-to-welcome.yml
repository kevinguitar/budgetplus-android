# L2 — Google sign-in leads to Welcome screen
appId: com.kevlina.budgetplus
---
- launchApp:
    clearState: true
- runFlow: ../common/ensure-logged-out.yml
- tapOn:
    text: "Continue with Google"
- runFlow: ../common/dismiss-system-dialogs.yml
- extendedWaitUntil:
    visible:
      text: "Book Name"
    timeout: 60000
- assertVisible:
    text: "Book Name"
- assertVisible:
    text: "My accounting book"
- assertVisible:
    text: "Go"
- assertVisible:
    text: "You can create a new accounting book"
